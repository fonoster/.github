name: Label sync

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Show the changes without applying them
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [.github/labels.yml]

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [fonoster/fonoster, fonoster/routr]
    steps:
      - uses: actions/checkout@v4
      - name: Keep only this repo's area labels
        run: |
          if [ "${{ matrix.repo }}" = "fonoster/fonoster" ]; then
            yq -i 'del(.[] | select(.name == "area: sip-core" or .name == "area: nat" or .name == "area: interop"))' .github/labels.yml
          else
            yq -i 'del(.[] | select(.name == "area: stream" or .name == "area: media" or .name == "area: autopilot" or .name == "area: sdk" or .name == "area: cli" or .name == "area: dashboard" or .name == "area: docs"))' .github/labels.yml
          fi
      - uses: EndBug/label-sync@v2
        with:
          token: ${{ secrets.LABEL_SYNC_TOKEN }}
          repository: ${{ matrix.repo }}
          config-file: .github/labels.yml
          delete-other-labels: true
          # Real run on push to main; manual runs default to dry-run.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
