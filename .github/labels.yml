# Source of truth for labels in fonoster/fonoster and fonoster/routr.
# `aliases` rename an old label in place (issue history is kept).
# Groups: type (blue), area (purple), priority (red), status (yellow), resolution (grey), bot (green).

# --- type: pick exactly one ---
- name: "type: bug"
  color: "1d76db"
  description: Something is broken
  aliases: [bug]
- name: "type: feature"
  color: "1d76db"
  description: New capability or improvement to an existing one
  aliases: [enhancement, feature, improvements]
- name: "type: docs"
  color: "1d76db"
  description: Documentation only
  aliases: [documentation]
- name: "type: chore"
  color: "1d76db"
  description: CI, refactors, housekeeping

# --- area: zero or more (fonoster only) ---
- name: "area: stream"
  color: "7057ff"
  description: Streams, protocol fonoster|twilio
- name: "area: media"
  color: "7057ff"
  description: Media server, audio, DTMF, recording
- name: "area: autopilot"
  color: "7057ff"
  description: Autopilot agents and engine
- name: "area: sdk"
  color: "7057ff"
  description: Client SDKs
- name: "area: cli"
  color: "7057ff"
  description: Command-line interface
  aliases: [cli]
- name: "area: dashboard"
  color: "7057ff"
  description: Dashboard web app
  aliases: [dashboard, webui]
- name: "area: docs"
  color: "7057ff"
  description: Docs site

# --- area: zero or more (routr only) ---
- name: "area: sip-core"
  color: "7057ff"
  description: SIP signaling and routing core
- name: "area: nat"
  color: "7057ff"
  description: NAT traversal
  aliases: [nat]
- name: "area: interop"
  color: "7057ff"
  description: Interoperability with other SIP software
  aliases: [interop]

# --- area: both repos ---
- name: "area: infra"
  color: "7057ff"
  description: Deploy, CI, containers
  aliases: [devops]

# --- priority ---
- name: "priority: p0"
  color: "b60205"
  description: Outage or security issue, drop everything
- name: breaking
  color: "b60205"
  description: Needs a major bump or a migration note
- name: "risk: high"
  color: "b60205"
  description: A maintainer reviews the plan before work starts

# --- status ---
- name: needs-triage
  color: "fbca04"
  description: Not yet reviewed
- name: needs-info
  color: "fbca04"
  description: Waiting on the reporter
- name: ready
  color: "0e8a16"
  description: Plan approved by a maintainer; agents may implement
- name: not-ready
  color: "fbca04"
  description: The implementer refused it; see the comment for the gap
- name: needs-human
  color: "d93f0b"
  description: A loop limit was hit or a decision needs a maintainer
- name: needs-issue
  color: "fbca04"
  description: A pull request with no linked issue
- name: blocked
  color: "fbca04"
  description: Waiting on something external
- name: good first issue
  color: "fbca04"
  description: Good for newcomers
- name: help wanted
  color: "fbca04"
  description: Extra attention is needed
  aliases: [help-wanted]

# --- resolution ---
- name: duplicate
  color: "cfd3d7"
  description: Already exists
- name: wontfix
  color: "cfd3d7"
  description: Will not be worked on

# --- bot / other ---
- name: external
  color: "c5def5"
  description: Opened by someone outside the org
- name: dependencies
  color: "0e8a16"
  description: Dependency updates (Dependabot)
- name: security
  color: "b60205"
  description: Security related
